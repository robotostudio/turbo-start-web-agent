name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One step, calling the same script an agent runs locally. These used to
      # be eight separate `run:` lines, which read better in the Actions UI but
      # meant CI and `package.json` were two lists that had to be kept in step
      # by hand -- and an agent reading AGENTS.md had to know all eight. With
      # one script, "green locally" and "green in CI" cannot come apart.
      # pnpm names the failing script in its output, so a failure is still
      # identifiable from the log.
      - run: pnpm run checks
