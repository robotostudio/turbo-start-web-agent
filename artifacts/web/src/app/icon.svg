<!--
  Placeholder favicon. Replace it with the client's own mark — unlike the
  site name, an SVG cannot come from content/settings/site.yml, so this file
  and the aria-label below are edited directly.

  Next.js picks up this file automatically (the app/icon.svg convention)
  and generates the link rel="icon" tag itself, no manual wiring needed.

  This is deliberately a plain monogram, not a crafted logo: every template
  adopter is expected to swap this file for their own brand mark. The two
  colors below are the sRGB renderings of two design tokens in
  src/app/globals.css: the badge is --primary (oklch(0.664 0.273 348.8)) and
  the glyph is --primary-foreground (oklch(0.178 0 0)). They are literal hex
  values because a favicon is served as a standalone document and can't
  resolve the host page's CSS custom properties.

  THIS IS A MANUAL SYNC POINT. Nothing checks it, and no CSS can reach it, so
  changing either token in globals.css leaves this file silently stale and the
  tab icon stops matching the site. It already happened once: these were
  #2b62ef and #ffffff, the light theme's blue primary on white, and both
  survived unnoticed into the dark redesign. Update them in the same commit
  that changes the tokens. The H glyph uses currentColor, so the two values
  here are the only edit needed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Site logo">
  <rect width="32" height="32" rx="8" fill="#ff12ae" />
  <g fill="currentColor" style="color: #111111">
    <rect x="9" y="8" width="4" height="16" rx="1" />
    <rect x="19" y="8" width="4" height="16" rx="1" />
    <rect x="9" y="14" width="14" height="4" rx="1" />
  </g>
</svg>
