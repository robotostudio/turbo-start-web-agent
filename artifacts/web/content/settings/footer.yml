# The footer. Four columns, a brand block with status pills, and a bottom bar.
#
# Every href here is checked by the same isSafeUrl rule the MDX lockdown
# applies, through a Zod .refine() in velite.config.ts. YAML never passes
# through remark, so that refine is the only thing standing between an edit here
# and an unsafe URL in production.
brand:
  name: Harbour
  href: /

# Small status badges under the brand note. Decorative but factual: do not put a
# claim here the repository cannot back up. `tone` picks the dot colour --
# "accent" gets a filled dot, "muted" gets none.
pills:
  - label: Build passing
    tone: accent
  - label: MIT licensed
    tone: muted

columns:
  - title: Site
    links:
      - label: Home
        href: /
      - label: About
        href: /about
      - label: Blog
        href: /blog
      - label: Contact
        href: /contact
  - title: Design system
    links:
      - label: Style guide
        href: /style-guide
      - label: Blocks gallery
        href: /blocks-gallery
  # Labels are the design's, exactly. The pages behind them do not exist yet, so
  # each href points at the closest thing that does -- mostly the starter posts,
  # which were written as this documentation. Repoint the hrefs when real pages
  # land; do not reword the labels to match what happens to exist.
  - title: Docs
    links:
      - label: Quickstart
        href: /blog/introducing-harbour
      - label: The Block system
        href: /blog/composing-pages
      - label: How content works
        href: /blog/what-content-cannot-contain
      - label: The build is the gate
        href: /blog/handing-over-the-site
  - title: Project
    links:
      - label: GitHub
        href: https://github.com/robotostudio/turbo-start-web-agent
      - label: Changelog
        href: https://github.com/robotostudio/turbo-start-web-agent/commits/main
      - label: MIT licence
        href: /terms

legal:
  - label: Privacy
    href: /privacy
  - label: Terms
    href: /terms

# Who built it, shown in the bottom bar next to the copyright. Optional: leave
# it out and the bottom bar just carries the copyright and the legal links.
builtBy:
  label: Roboto
  href: https://robotostudio.com

# Label for the anchor back to the top of the page. Optional.
backToTop: Back to top

note: Harbour is MIT-licensed. Clone it, edit the content in git or through any AI agent, and ship your own site.
copyrightNote: Released under the MIT license.
