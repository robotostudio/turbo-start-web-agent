# Site footer: wordmark, link columns, social links, legal row, and a short
# note. Rendered by src/components/site/site-footer.tsx. Every `href` is
# validated by velite.config.ts (Zod .refine(isSafeUrl, ...)) because YAML
# never passes through the MDX content-lockdown remark plugin.
#
# Not content, and not here: the copyright year (computed at build time) and
# the "©"/brand-name assembly around it, and the actual social-icon SVGs
# (`icon` below just selects one of the two hardcoded in the component).
brand:
  name: Harbour
  href: /
columns:
  - title: Site
    links:
      - label: Home
        href: /
      - label: About
        href: /about
      - label: Blog
        href: /blog
  - title: Design system
    links:
      - label: Style guide
        href: /style-guide
      - label: Blocks gallery
        href: /blocks-gallery
social:
  - label: Harbour on X
    href: https://x.com
    icon: x
  - label: Harbour on GitHub
    href: https://github.com
    icon: github
builtBy:
  label: Built by Roboto Studio
  href: https://robotostudio.com
legal: []
note: Harbour is MIT-licensed. Clone it, edit the content in Git or through any AI agent, and ship your own site.
