# The header. Every part of it is here rather than in site-header.tsx: the
# links, the button, and the icon link beside it.
#
# `items` is flat. It used to nest "Design system" over Style guide and Blocks
# gallery, but only the mobile drawer ever rendered `children` -- the desktop nav
# ignored them and linked the parent. The 2026-09 redesign drops the dropdown, so
# what shipped on desktop is now what ships everywhere. `children` is still in
# the schema; nothing uses it today.
#
# Every href is checked by the same isSafeUrl rule the MDX lockdown applies,
# through a Zod .refine() in velite.config.ts. YAML never passes through remark,
# so that refine is the only thing standing between an edit here and an unsafe
# URL in production.
items:
  - label: About
    href: /about
  - label: Blog
    href: /blog
  - label: Blocks gallery
    href: /blocks-gallery
  - label: Contact
    href: /contact

# The header's call to action. Optional: leave it out and the header renders
# without a button.
cta:
  label: Get started
  href: /about

# Icon links beside the button. `icon` picks one of the marks in
# src/components/site/social-icons.tsx; it is not markup, only which one.
social:
  - label: Harbour on GitHub
    href: https://github.com
    icon: github
