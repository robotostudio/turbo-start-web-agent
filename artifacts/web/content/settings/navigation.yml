# Primary site navigation. Rendered by src/components/site/site-header.tsx.
# Every `href` is validated by velite.config.ts (Zod .refine(isSafeUrl, ...))
# because YAML never passes through the MDX content-lockdown remark plugin.
# No "Home" entry: the wordmark on the left of the header is already an
# <a href="/"> (aria-label="Homepage"), so a Home link duplicates it and
# spends a nav slot on the one destination every visitor can already reach.
items:
  - label: About
    href: /about
  - label: Blog
    href: /blog
  - label: Blocks gallery
    href: /blocks-gallery
